name = "brenson-services"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Variables públicas (las secretas van con `wrangler secret put`)
[vars]
ENVIRONMENT = "staging"
ALLOWED_ORIGINS = "https://brenson.co,https://www.brenson.co,https://brenson-0.myshopify.com,http://127.0.0.1:9292"
SHOPIFY_SHOP = "brenson-0.myshopify.com"
SHOPIFY_API_VERSION = "2025-07"

# Proveedores: mock | real. Ver docs/ESTRATEGIA_SIMULACION.md (S10, S16)
CRM_PROVIDER = "mock"         # mock | ghl
MAIL_PROVIDER = "console"     # console | resend
PDF_PROVIDER = "html"         # html | pdfmonkey
STORAGE_PROVIDER = "local"    # local | r2
FINANCING_PROVIDER = "mock"   # mock | addi — respuesta de cupo Addi determinística en mock

# Addi (BNPL) — solo se usan si FINANCING_PROVIDER = "addi". No son secretos por sí solos (son URLs/ids
# públicos del convenio), pero solo tienen efecto junto con ADDI_CLIENT_ID/SECRET (`wrangler secret put`).
# ADDI_AUTH_URL = ""     # ej. token endpoint de Auth0 que entregue Addi
# ADDI_API_BASE = ""     # ej. https://api.addi.com (confirmar con el manual de integración de Addi)
# ADDI_AUDIENCE = ""
# ADDI_MERCHANT_ID = ""

ADVISOR_EMAIL = "empresas@brenson.co"
MAIL_FROM = "Brenson <cotizaciones@brenson.co>"
QUOTE_VALIDITY_DAYS = "15"
UPLOAD_MAX_BYTES = "5242880"

# Secretos esperados (wrangler secret put <NAME>):
#   SHOPIFY_ADMIN_TOKEN     token de app custom con read_customers, write_customers, read_products, write_metaobjects
#   SHOPIFY_WEBHOOK_SECRET  para verificar HMAC de webhooks
#   GHL_WEBHOOK_URL         webhook entrante de GoHighLevel (cuando exista)
#   GHL_API_KEY             opcional, para upsert por API
#   RESEND_API_KEY
#   PDFMONKEY_API_KEY, PDFMONKEY_TEMPLATE_QUOTE, PDFMONKEY_TEMPLATE_SPEC
#   TURNSTILE_SECRET
#   QUOTE_SIGNING_SECRET    firma de enlaces de PDF
#   ADDI_CLIENT_ID, ADDI_CLIENT_SECRET   credenciales Auth0 client-credentials del convenio con Addi

[[kv_namespaces]]
binding = "KV"
id = "88e78f93015e46d8b5c439b52c6b2cec"
preview_id = "4b7852d761e74571a968971728059e90"

# R2 requiere habilitarse manualmente en el Dashboard de Cloudflare (Account Home → R2 → habilitar,
# pide método de pago aunque el uso quede en el tier gratis). Mientras STORAGE_PROVIDER = "local",
# el binding no se usa en tiempo de ejecución. Descomentar y correr
# `wrangler r2 bucket create brenson-b2b-docs` + `brenson-b2b-docs-dev` cuando se habilite,
# y cambiar STORAGE_PROVIDER a "r2".
# [[r2_buckets]]
# binding = "DOCS"
# bucket_name = "brenson-b2b-docs"
# preview_bucket_name = "brenson-b2b-docs-dev"

[observability]
enabled = true
