name = "brenson-services"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Variables públicas (las secretas van con `wrangler secret put`)
[vars]
ENVIRONMENT = "development"
ALLOWED_ORIGINS = "https://brenson.co,https://www.brenson.co,https://brenson-co.myshopify.com,http://127.0.0.1:9292"
SHOPIFY_SHOP = "brenson-co.myshopify.com"
SHOPIFY_API_VERSION = "2025-07"

# Proveedores: mock | real. Ver docs/ESTRATEGIA_SIMULACION.md (S10, S16)
CRM_PROVIDER = "mock"         # mock | ghl
MAIL_PROVIDER = "console"     # console | resend
PDF_PROVIDER = "html"         # html | pdfmonkey
STORAGE_PROVIDER = "local"    # local | r2

ADVISOR_EMAIL = "empresas@brenson.co"
MAIL_FROM = "Brenson <cotizaciones@brenson.co>"
QUOTE_VALIDITY_DAYS = "15"
UPLOAD_MAX_BYTES = "5242880"

# Secretos esperados (wrangler secret put <NAME>):
#   SHOPIFY_ADMIN_TOKEN     token de app custom con read_customers, write_customers, read_products, write_metaobjects
#   SHOPIFY_WEBHOOK_SECRET  para verificar HMAC de webhooks
#   GHL_WEBHOOK_URL         webhook entrante de GoHighLevel (cuando exista)
#   GHL_API_KEY             opcional, para upsert por API
#   RESEND_API_KEY
#   PDFMONKEY_API_KEY, PDFMONKEY_TEMPLATE_QUOTE, PDFMONKEY_TEMPLATE_SPEC
#   TURNSTILE_SECRET
#   QUOTE_SIGNING_SECRET    firma de enlaces de PDF

[[kv_namespaces]]
binding = "KV"
id = "REEMPLAZAR_KV_ID"
preview_id = "REEMPLAZAR_KV_PREVIEW_ID"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "brenson-b2b-docs"
preview_bucket_name = "brenson-b2b-docs-dev"

[observability]
enabled = true
