# App custom de Brenson: solo contiene la Shopify Function de descuento por tier B2B.
# Crear la app en el Partner Dashboard / Dev Dashboard y reemplazar client_id.
client_id = "REEMPLAZAR_CLIENT_ID"
name = "Brenson B2B Functions"
application_url = "https://brenson.co"
embedded = false

[build]
automatically_update_urls_on_dev = false
include_config_on_deploy = true

[access_scopes]
scopes = "write_discounts,read_customers,read_products"

[webhooks]
api_version = "2025-07"
