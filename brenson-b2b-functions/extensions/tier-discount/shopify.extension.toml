api_version = "2025-07"

[[extensions]]
name = "Brenson · Descuento por tier B2B"
handle = "brenson-tier-discount"
type = "function"
description = "Aplica el porcentaje de descuento del tier corporativo del cliente a cada línea que cumpla el mínimo de unidades."

  [[extensions.targeting]]
  target = "cart.lines.discounts.generate.run"
  input_query = "src/run.graphql"
  export = "run"

  [extensions.build]
  command = ""
  path = "dist/function.wasm"

  [extensions.ui]
  # Sin UI de configuración: los parámetros viven en metaobjects/metafields de Shopify.
