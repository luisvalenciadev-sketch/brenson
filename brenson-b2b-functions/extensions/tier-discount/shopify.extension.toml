api_version = "2026-07"

[[extensions]]
name = "Brenson · Descuento por tier B2B"
handle = "brenson-tier-discount"

uid = "71ed19fb-c6d8-536e-c437-1f965ef91b8ded30a6fa"
type = "function"
description = "Aplica el porcentaje de descuento del tier corporativo del cliente a cada línea que cumpla el mínimo de unidades."

  [[extensions.targeting]]
  target = "cart.lines.discounts.generate.run"
  input_query = "src/run.graphql"
  export = "run"

  # Sin `command`: para Functions en JS la CLI compila sola (esbuild + javy) desde src/index.js.
  # `command = "npm run build"` hacía que `shopify app function build` se llamara a sí mismo en
  # bucle (el script build del package.json ES ese mismo comando): por eso el deploy "se colgaba".
  [extensions.build]
  path = "dist/function.wasm"

  [extensions.ui]
  # Sin UI de configuración: los parámetros viven en metaobjects/metafields de Shopify.
