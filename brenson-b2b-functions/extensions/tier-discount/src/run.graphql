query RunInput {
  # El input de Functions NO resuelve referencias (metafield.reference no existe aquí): el tier del
  # cliente llega como el GID crudo del metaobject, y el % se busca en la configuración del propio
  # descuento, que sincroniza scripts/sync-tier-discount-config.mjs desde los metaobjects brenson_tier_b2b.
  discount {
    discountClasses
    config: metafield(namespace: "$app:brenson", key: "config") { jsonValue }
  }
  cart {
    buyerIdentity {
      customer {
        id
        hasTags(tags: ["cliente-corporativo"]) { tag hasTag }
        tier: metafield(namespace: "brenson_b2b", key: "tier") { value }
      }
    }
    lines {
      id
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            b2bDisponible: metafield(namespace: "brenson", key: "b2b_disponible") { value }
            minB2B: metafield(namespace: "brenson", key: "b2b_minimo_unidades") { value }
            tierOverride: metafield(namespace: "brenson", key: "b2b_precio_tier") { value }
          }
        }
      }
    }
  }
}
